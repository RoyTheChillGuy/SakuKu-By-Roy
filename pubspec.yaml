name: sakuku_app
description: "SakuKu — offline-first personal finance app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (Riverpod 3.x — compatible with isar_community_generator / source_gen 4)
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Offline-first database (maintained Isar community fork — API-compatible with isar 3.x)
  # Note: original `isar` / `isar_generator` are unmaintained and break on Dart 3.11.
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  path_provider: ^2.1.5

  # UI & charts
  fl_chart: ^1.2.0
  google_fonts: ^6.3.2
  lucide_icons: ^0.257.0
  intl: ^0.20.2
  flutter_animate: ^4.5.0
  skeletonizer: ^3.0.0
  lottie: ^3.1.0
  badges: ^3.1.2
  pinput: ^5.0.0

  # Security & preferences
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6

  # Export & share
  share_plus: ^10.1.4
  pdf: ^3.11.3

  # Media & reminders
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  app_links: ^6.4.0
  flutter_local_notifications: ^17.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  isar_community_generator: ^3.4.1
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#3B0764"
  adaptive_icon_foreground: assets/icon/app_icon.png
  remove_alpha_ios: true

dependency_overrides:
  # pdf → image → archive; 4.0.9 breaks dart2js (decodeLazy).
  archive: ^4.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/animations/splash_pulse.json
